services:
  chatbot_ui:
    build: .
    container_name: robotito_chatbot_ui
    ports:
      - "${UI_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      ROBOTITO_BOOTSTRAP_ENGINE: "${ROBOTITO_BOOTSTRAP_ENGINE:-false}"
    volumes:
      - ./src/baseConocimiento:/app/src/baseConocimiento
      - ./config:/app/config
      - ./static:/app/static
      - ./data/conversations.db:/app/conversations.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  chatbot_api:
    build: .
    container_name: robotito_chatbot_api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ROBOTITO_BOOTSTRAP_ENGINE: "${ROBOTITO_BOOTSTRAP_ENGINE:-false}"
    volumes:
      - ./src/baseConocimiento:/app/src/baseConocimiento
      - ./config:/app/config
      - ./static:/app/static
      - ./data/conversations.db:/app/conversations.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
